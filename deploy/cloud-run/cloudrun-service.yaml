apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: routewitness-app
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: routewitness
    app.kubernetes.io/part-of: accessgraph
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: routewitness-runner@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/routewitness/app:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - name: http1
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
          env:
            - name: NODE_ENV
              value: "production"
