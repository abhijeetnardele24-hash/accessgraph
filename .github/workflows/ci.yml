name: AccessGraph CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deployment"
  cancel-in-progress: false

jobs:
  verify:
    name: Build, Typecheck, Lint, Tests, Security & E2E Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Vitest Unit & Component Coverage
        run: npm test

      - name: Reproducible Routing & Access Debt Benchmarks
        run: npm run benchmark

      - name: Evidence & Metric Synchronization Check
        run: npm run evidence:check

      - name: Production Vite Build
        run: npm run build

      - name: Secret & Credential History Scan
        run: npm run security-scan

      - name: Dependency Security Audit
        run: npm run audit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Audits (45 executions)
        run: npm run test:e2e

  deploy:
    name: Deploy Production Bundle to gh-pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install & Build Production Artifacts
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

