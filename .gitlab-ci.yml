# ===========================================================================
# RouteWitness — GitLab CI/CD Pipeline
# Life After Code — GitLab Transcend Hackathon (Path B Supervised Entry)
# ===========================================================================

stages:
  - provenance
  - plan
  - verify
  - secure
  - package
  - deploy-candidate
  - replay
  - promote
  - monitor
  - evidence

default:
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

variables:
  CANARY_TRAFFIC_PCT: "0"
  GCP_REGION: "us-central1"
  CLOUD_RUN_SERVICE: "routewitness-app"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# ---------------------------------------------------------------------------
# Stage 1: Provenance & License Verification
# ---------------------------------------------------------------------------
provenance:license-and-origin:
  stage: provenance
  needs: []
  script:
    - npm ci
    - npx tsx scripts/verify-provenance.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Stage 2: Plan (Duo Impact Manifest)
# Uses Git ref loader (CI_MERGE_REQUEST_DIFF_BASE_SHA & CI_COMMIT_SHA)
# ---------------------------------------------------------------------------
plan:impact-manifest:
  stage: plan
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - npx tsx route-witness/cli/index.ts classify
  artifacts:
    name: "impact-manifest-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/route-witness/impact-manifest.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Stage 3: Verify (Invariants, Policy, Unit, Golden, and Accessibility)
# ---------------------------------------------------------------------------
verify:policy-integrity:
  stage: verify
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - npx tsx scripts/verify-policy-integrity.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify:unit-tests:
  stage: verify
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage/
    expire_in: 30 days

verify:golden-regression:
  stage: verify
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - npx vitest run tests/unit/routeWitness.golden.test.ts

verify:counterfactual-matrix:
  stage: verify
  needs:
    - plan:impact-manifest
  script:
    - npm ci
    - npx tsx route-witness/cli/index.ts compare
    - npx tsx route-witness/cli/index.ts minimize
  artifacts:
    name: "witnesses-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/route-witness/witnesses.json
      - artifacts/route-witness/minimal-witness.json
    expire_in: 30 days

verify:accessibility-axe:
  stage: verify
  needs:
    - provenance:license-and-origin
  image: mcr.microsoft.com/playwright:v1.50.1-noble
  script:
    - npm ci
    - npm run build
    - npx playwright test tests/e2e/accessibility.spec.ts
  artifacts:
    when: always
    paths:
      - artifacts/reports/playwright-results.json
      - playwright-report/
    expire_in: 14 days

# ---------------------------------------------------------------------------
# Stage 4: Secure (Audit, Secret Scan)
# ---------------------------------------------------------------------------
secure:dependency-audit:
  stage: secure
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - npm audit --omit=dev --audit-level=high

secure:secret-scan:
  stage: secure
  needs:
    - provenance:license-and-origin
  script:
    - npm ci
    - node scripts/security-scan.cjs
  artifacts:
    paths:
      - docs/security-audit.json
    expire_in: 30 days

# ---------------------------------------------------------------------------
# Stage 5: Package (OCI Container & Container Registry)
# Requires authentic registry credentials; remains non-executing / NOT_MEASURED otherwise
# ---------------------------------------------------------------------------
package:container-image:
  stage: package
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - verify:unit-tests
    - verify:policy-integrity
    - verify:counterfactual-matrix
    - verify:accessibility-axe
    - secure:dependency-audit
    - secure:secret-scan
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - echo "IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA)" > image_digest.env
  artifacts:
    reports:
      dotenv: image_digest.env
  rules:
    - if: '$CI_REGISTRY_USER && $CI_REGISTRY_PASSWORD && ($CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event")'

# ---------------------------------------------------------------------------
# Stage 6: Deploy Candidate (Tagged Cloud Run revision with 0% traffic)
# Requires authentic GCP credentials; remains non-executing / NOT_MEASURED otherwise
# ---------------------------------------------------------------------------
deploy:candidate-cloud-run:
  stage: deploy-candidate
  image: google/cloud-sdk:alpine
  needs:
    - package:container-image
  script:
    - echo "$GCP_SA_KEY" > /tmp/gcp_key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - bash deploy/cloud-run/deploy.sh > deploy_output.txt
    - cat deploy_output.txt
    - CANDIDATE_URL=$(grep "https://" deploy_output.txt | tail -n 1 | tr -d ' ')
    - echo "CANDIDATE_URL=${CANDIDATE_URL}" > candidate.env
  artifacts:
    reports:
      dotenv: candidate.env
    paths:
      - deploy_output.txt
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_SA_KEY && ($CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event")'

# ---------------------------------------------------------------------------
# Stage 7: Replay Deployed Candidate
# Replays Journey Witness against the real deployed Cloud Run revision
# ---------------------------------------------------------------------------
replay:deployed-witness:
  stage: replay
  needs:
    - deploy:candidate-cloud-run
    - verify:counterfactual-matrix
  script:
    - npm ci
    - npx tsx scripts/replay-deployment.ts
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_SA_KEY && ($CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event")'

# ---------------------------------------------------------------------------
# Stage 8: Release Promotion (Protected Human Decision)
# ---------------------------------------------------------------------------
promote:production:
  stage: promote
  image: google/cloud-sdk:alpine
  needs:
    - replay:deployed-witness
  when: manual
  script:
    - echo "$GCP_SA_KEY" > /tmp/gcp_key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --to-tags "rev-${CI_COMMIT_SHORT_SHA}=100"
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_SA_KEY && $CI_COMMIT_BRANCH == "main"'
      when: manual

rollback:production:
  stage: promote
  image: google/cloud-sdk:alpine
  needs:
    - replay:deployed-witness
  when: manual
  script:
    - echo "$GCP_SA_KEY" > /tmp/gcp_key.json
    - gcloud auth activate-service-account --key-file=/tmp/gcp_key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - echo "Executing rollback to previous stable Cloud Run revision..."
    - gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" --region "${GCP_REGION}" --to-latest=false
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_SA_KEY && $CI_COMMIT_BRANCH == "main"'
      when: manual

# ---------------------------------------------------------------------------
# Stage 9: Monitor (Production Post-Deploy Smoke)
# ---------------------------------------------------------------------------
monitor:production-smoke:
  stage: monitor
  needs:
    - promote:production
  script:
    - npm ci
    - CANDIDATE_URL="https://${CLOUD_RUN_SERVICE}-${GCP_REGION}.a.run.app" npx tsx scripts/replay-deployment.ts
  rules:
    - if: '$GCP_PROJECT_ID && $GCP_SA_KEY && $CI_COMMIT_BRANCH == "main"'
      when: on_success

# ---------------------------------------------------------------------------
# Stage 10: Evidence (Checksummed Release Receipt & Final Verification Bundle)
# ---------------------------------------------------------------------------
evidence:release-receipt:
  stage: evidence
  needs:
    - verify:unit-tests
    - verify:policy-integrity
    - verify:counterfactual-matrix
    - verify:accessibility-axe
    - secure:secret-scan
  script:
    - npm ci
    - npx tsx route-witness/cli/index.ts receipt
    - npx tsx scripts/generate-final-evidence.ts
  artifacts:
    name: "release-receipt-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/route-witness/release-receipt.json
      - artifacts/route-witness/release-receipt.md
      - artifacts/route-witness/authoritative-evidence-*.json
      - docs/verification-results.json
    expire_in: 90 days
