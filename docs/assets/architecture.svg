<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#F8F7F4; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#181A1B"/>
    </filter>
    <linearGradient id="civic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E35"/>
      <stop offset="100%" stop-color="#0E3323"/>
    </linearGradient>
    <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6494"/>
      <stop offset="100%" stop-color="#124566"/>
    </linearGradient>
  </defs>

  <!-- Title & Scope Header -->
  <rect x="20" y="20" width="920" height="60" rx="8" fill="#FFFFFF" stroke="#E2DFD8" filter="url(#shadow)"/>
  <text x="40" y="52" font-size="20" font-weight="800" fill="#164E35">AccessGraph System Architecture</text>
  <text x="400" y="52" font-size="13" font-weight="600" fill="#4D5358">100% Client-Side Private Execution • Zero Telemetry • Offline-First PWA</text>
  <rect x="800" y="36" width="120" height="26" rx="13" fill="#EDF6F1" stroke="#C4E2D1"/>
  <text x="860" y="53" font-size="11" font-weight="700" fill="#164E35" text-anchor="middle">WCAG 2.2 AA</text>

  <!-- Layer 1: Client Storage & Ingestion -->
  <rect x="20" y="100" width="280" height="490" rx="8" fill="#FFFFFF" stroke="#E2DFD8" filter="url(#shadow)"/>
  <rect x="20" y="100" width="280" height="38" rx="8" fill="#F1EFEA"/>
  <text x="36" y="125" font-size="14" font-weight="800" fill="#181A1B">DATA &amp; PERSISTENCE LAYER</text>

  <!-- Block: Campus Dataset -->
  <rect x="36" y="152" width="248" height="90" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="48" y="174" font-size="13" font-weight="700" fill="#164E35">Campus Topology Dataset</text>
  <text x="48" y="194" font-size="11" fill="#4D5358">• Synthetic Demo Campus Graph</text>
  <text x="48" y="210" font-size="11" fill="#4D5358">• 16 Multi-Level Nodes &amp; 18 Edges</text>
  <text x="48" y="226" font-size="11" fill="#545B62">• Slopes, Surfaces, Sensory, Widths</text>

  <!-- Block: Local Barrier Store -->
  <rect x="36" y="258" width="248" height="96" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="48" y="280" font-size="13" font-weight="700" fill="#B45309">Private Local Storage</text>
  <text x="48" y="300" font-size="11" fill="#4D5358">• Active Barrier Incidents</text>
  <text x="48" y="316" font-size="11" fill="#4D5358">• User Accessibility Profiles</text>
  <text x="48" y="332" font-size="11" fill="#545B62">• Zero Remote Transmission / Cookies</text>

  <!-- Block: Service Worker PWA -->
  <rect x="36" y="370" width="248" height="96" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="48" y="392" font-size="13" font-weight="700" fill="#1B6494">Service Worker &amp; Offline Cache</text>
  <text x="48" y="412" font-size="11" fill="#4D5358">• Stale-While-Revalidate Caching</text>
  <text x="48" y="428" font-size="11" fill="#4D5358">• Static Asset &amp; Manifest Fallback</text>
  <text x="48" y="444" font-size="11" fill="#545B62">• Offline Navigation Resilience</text>

  <!-- Block: Benchmark Scenarios -->
  <rect x="36" y="482" width="248" height="90" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="48" y="504" font-size="13" font-weight="700" fill="#181A1B">Benchmark Scenarios</text>
  <text x="48" y="524" font-size="11" fill="#4D5358">• 8 Calibrated Transit Routes</text>
  <text x="48" y="540" font-size="11" fill="#4D5358">• Diverse Profile Coverage</text>
  <text x="48" y="556" font-size="11" fill="#545B62">• Trip-Weighted Frequency Baseline</text>

  <!-- Layer 2: Routing & Diagnostic Domain Engines -->
  <rect x="320" y="100" width="320" height="490" rx="8" fill="#FFFFFF" stroke="#E2DFD8" filter="url(#shadow)"/>
  <rect x="320" y="100" width="320" height="38" rx="8" fill="#F1EFEA"/>
  <text x="336" y="125" font-size="14" font-weight="800" fill="#181A1B">DOMAIN COMPUTATION ENGINES</text>

  <!-- Engine Box: Routing -->
  <rect x="336" y="152" width="288" height="196" rx="6" fill="#EDF6F1" stroke="#C4E2D1"/>
  <text x="350" y="174" font-size="13" font-weight="800" fill="#164E35">Multi-Objective Route Engine</text>
  <text x="350" y="196" font-size="11" font-weight="600" fill="#181A1B">1. Hard Constraint Filter</text>
  <text x="364" y="212" font-size="11" fill="#4D5358">• Stairs, Incline, Lift, Width, Surface</text>
  <text x="350" y="232" font-size="11" font-weight="600" fill="#181A1B">2. Soft Cost Function (Profile-Weighted)</text>
  <text x="364" y="248" font-size="11" fill="#4D5358">• Time + Slope + Light + Sensory + Shade</text>
  <text x="350" y="268" font-size="11" font-weight="600" fill="#181A1B">3. Deterministic Dijkstra Search</text>
  <text x="364" y="284" font-size="11" fill="#4D5358">• 4-Key Tie-Breaker (Cost, Time, Dist, ID)</text>
  <text x="350" y="304" font-size="11" font-weight="600" fill="#181A1B">4. Rationale Explainer</text>
  <text x="364" y="320" font-size="11" fill="#4D5358">• Proof of why alternatives were rejected</text>

  <!-- Engine Box: Access Debt -->
  <rect x="336" y="364" width="288" height="208" rx="6" fill="#EBF4FA" stroke="#B8D7EB"/>
  <text x="350" y="386" font-size="13" font-weight="800" fill="#1B6494">Access Debt Audit &amp; Repair Ranker</text>
  <text x="350" y="408" font-size="11" font-weight="600" fill="#181A1B">1. Network Penalty Ratio</text>
  <text x="364" y="424" font-size="11" fill="#4D5358">• penalty = accessibleTime / fastestTime</text>
  <text x="350" y="444" font-size="11" font-weight="600" fill="#181A1B">2. Counterfactual Simulation</text>
  <text x="364" y="460" font-size="11" fill="#4D5358">• Tests hypothetical repair of each barrier</text>
  <text x="350" y="480" font-size="11" font-weight="600" fill="#181A1B">3. Priority Ranking Formula</text>
  <text x="364" y="496" font-size="11" fill="#4D5358">• Disconnected routes restored × 100</text>
  <text x="364" y="512" font-size="11" fill="#4D5358">• + Cumulative minutes saved across trips</text>
  <text x="350" y="532" font-size="11" font-weight="600" fill="#181A1B">4. Instant Capital Allocation Insights</text>
  <text x="364" y="548" font-size="11" fill="#4D5358">• Objective repair ROI for facilities managers</text>

  <!-- Layer 3: Presentation UI -->
  <rect x="660" y="100" width="280" height="490" rx="8" fill="#FFFFFF" stroke="#E2DFD8" filter="url(#shadow)"/>
  <rect x="660" y="100" width="280" height="38" rx="8" fill="#F1EFEA"/>
  <text x="676" y="125" font-size="14" font-weight="800" fill="#181A1B">PRESENTATION &amp; ACCESSIBLE UI</text>

  <!-- Component Box: SVG Map -->
  <rect x="676" y="152" width="248" height="96" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="688" y="174" font-size="13" font-weight="700" fill="#164E35">Interactive SVG Campus Map</text>
  <text x="688" y="194" font-size="11" fill="#4D5358">• Multi-Level Buildings &amp; Quads</text>
  <text x="688" y="210" font-size="11" fill="#4D5358">• Waypoints, Ramp Bridges, Lifts</text>
  <text x="688" y="226" font-size="11" fill="#545B62">• Active Detour Route Highlighting</text>

  <!-- Component Box: Wayfinding Inspector -->
  <rect x="676" y="264" width="248" height="96" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="688" y="286" font-size="13" font-weight="700" fill="#181A1B">Wayfinding Route Inspector</text>
  <text x="688" y="306" font-size="11" fill="#4D5358">• Turn-by-Turn Instruction List</text>
  <text x="688" y="322" font-size="11" fill="#4D5358">• Deterministic Rationale Banner</text>
  <text x="688" y="338" font-size="11" fill="#545B62">• Multi-Objective Cost Matrix</text>

  <!-- Component Box: Access Debt Dashboard -->
  <rect x="676" y="376" width="248" height="96" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="688" y="398" font-size="13" font-weight="700" fill="#1B6494">Access Debt Dashboard</text>
  <text x="688" y="418" font-size="11" fill="#4D5358">• Key Metrics Scorecard</text>
  <text x="688" y="434" font-size="11" fill="#4D5358">• Prioritized Repair Candidates Table</text>
  <text x="688" y="450" font-size="11" fill="#545B62">• Interactive "Simulate Fix" Buttons</text>

  <!-- Component Box: Controls & Incident Dialog -->
  <rect x="676" y="488" width="248" height="84" rx="6" fill="#F8F7F4" stroke="#C8C4BA"/>
  <text x="688" y="510" font-size="13" font-weight="700" fill="#181A1B">Controls &amp; Incident Dialog</text>
  <text x="688" y="530" font-size="11" fill="#4D5358">• 5 Profile Presets &amp; Terminal Pickers</text>
  <text x="688" y="546" font-size="11" fill="#545B62">• Keyboard-Trapped Incident Modal</text>

  <!-- Data Flow Arrows -->
  <path d="M 284 200 L 336 200" stroke="#164E35" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <path d="M 284 416 L 336 416" stroke="#1B6494" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <path d="M 624 220 L 676 220" stroke="#164E35" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 624 430 L 676 430" stroke="#1B6494" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
